name: Windows package

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: "只重打安装包，跳过 cargo build（通常不要勾）"
        type: boolean
        default: false
  push:
    branches:
      - "feature/windows-vietnamese-package"
    tags:
      - "windows-v*"

permissions:
  contents: read

jobs:
  package:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust targets
        shell: pwsh
        run: |
          rustup target add i686-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-package-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-package-${{ runner.os }}-

      - name: Fetch product data
        shell: bash
        run: tools/release/data-fetch.sh

      - name: Pack Vietnamese glossary
        shell: bash
        run: |
          cargo run --release --locked -q -p qingjian-dict-convert -- \
            pack glossary \
            --language vi \
            --input assets/glossary/glossary-vi.tsv \
            --name "青简越南语释义表" \
            --license "LLM-output" \
            --attribution "LLM 生成，qingjian-gloss-gen" \
            --source "assets/glossary/glossary-vi.tsv"

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' `
            -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw '找不到 Inno Setup 7 的 ISCC.exe' }
          Write-Host "使用 $iscc"
          "QINGJIAN_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          $args = @('-ExecutionPolicy', 'Bypass', '-File', 'apps\windows\installer\build.ps1')
          if ('${{ inputs.skip_build }}' -eq 'true') { $args += '-SkipBuild' }
          powershell @args

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-windows-installer
          path: target/installer/*-windows-x86_64-setup.exe
          if-no-files-found: error
